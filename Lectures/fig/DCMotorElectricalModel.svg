<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="144mm"
     height="48mm"
     viewBox="0 0 960 320"
     version="1.1">
  <title>Reflected electrical model of a DC motor</title>
  <desc>
    Input voltage u(t) drives armature resistance R and inductance L in series.
    At the back-EMF node v_b equals K_e omega, an equivalent capacitor and
    resistor represent the reflected inertia and viscous friction in parallel.
  </desc>

  <defs>
    <style>
      .background { fill: #ffffff; }
      .circuit {
        fill: none;
        stroke: #1768ac;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .terminal {
        fill: #ffffff;
        stroke: #1768ac;
        stroke-width: 5;
      }
      .junction { fill: #1768ac; }
      .label {
        fill: #172b3a;
        font-family: "DejaVu Sans", "Liberation Sans", sans-serif;
        font-size: 24px;
        font-weight: 500;
      }
      .component-label {
        fill: #172b3a;
        font-family: "DejaVu Sans", "Liberation Sans", sans-serif;
        font-size: 25px;
        font-style: italic;
        font-weight: 500;
      }
      .relation {
        fill: #405568;
        font-family: "DejaVu Sans", "Liberation Sans", sans-serif;
        font-size: 21px;
        font-style: italic;
      }
      .subscript { font-size: 16px; }
      .polarity {
        fill: #1768ac;
        font-family: "DejaVu Sans", "Liberation Sans", sans-serif;
        font-size: 25px;
        font-weight: 600;
      }
    </style>
  </defs>

  <rect class="background" width="960" height="320"/>

  <!-- Closed input source and return path -->
  <path class="circuit" d="M 72,112 H 132"/>
  <path class="circuit" d="M 72,112 V 160"/>
  <circle class="terminal" cx="72" cy="194" r="34"/>
  <path class="circuit" d="M 72,228 V 276 H 800"/>
  <text class="label" x="22" y="202">u(t)</text>
  <text class="polarity" x="72" y="186" text-anchor="middle">+</text>
  <text class="polarity" x="72" y="220" text-anchor="middle">-</text>

  <!-- Armature resistance -->
  <path class="circuit" d="M 132,112 l 14,-18 20,36 20,-36 20,36 20,-36 20,36 14,-18"/>
  <text class="component-label" x="196" y="69" text-anchor="middle">R</text>

  <!-- Armature inductance -->
  <path class="circuit" d="M 260,112 H 310"/>
  <path class="circuit" d="M 310,112
                           C 310,82 350,82 350,112
                           C 350,82 390,82 390,112
                           C 390,82 430,82 430,112
                           C 430,82 470,82 470,112"/>
  <text class="component-label" x="390" y="69" text-anchor="middle">L</text>

  <!-- Back-EMF node and top bus -->
  <path class="circuit" d="M 470,112 H 800"/>
  <circle class="junction" cx="568" cy="112" r="8"/>
  <text class="component-label" x="568" y="43" text-anchor="middle">
    v<tspan class="subscript" baseline-shift="sub">b</tspan>
    <tspan font-style="normal"> = </tspan>
    K<tspan class="subscript" baseline-shift="sub">e</tspan>
    <tspan>&#x03c9;</tspan>
  </text>
  <text class="relation" x="568" y="76" text-anchor="middle">
    &#x03c9; = v<tspan class="subscript" baseline-shift="sub">b</tspan>/K<tspan class="subscript" baseline-shift="sub">e</tspan>
  </text>

  <!-- Equivalent inertia: the only capacitor, in parallel with R_eq -->
  <g id="equivalent-capacitor">
    <path class="circuit" d="M 650,112 V 168 M 624,168 H 676 M 624,184 H 676 M 650,184 V 276"/>
  </g>
  <text class="component-label" x="606" y="214" text-anchor="end">
    C<tspan class="subscript" baseline-shift="sub">eq</tspan>
    <tspan font-style="normal"> = </tspan>
  </text>
  <text class="component-label" x="606" y="247" text-anchor="end">
    J/(K<tspan class="subscript" baseline-shift="sub">e</tspan>
    K<tspan class="subscript" baseline-shift="sub">t</tspan>)
  </text>

  <!-- Equivalent viscous friction resistor, parallel with C_eq -->
  <path class="circuit" d="M 800,112 V 140 l -18,13 36,18 -36,18 36,18 -36,18 36,18 -18,13 V 276"/>
  <text class="component-label" x="844" y="184">
    R<tspan class="subscript" baseline-shift="sub">eq</tspan>
    <tspan font-style="normal"> = </tspan>
  </text>
  <text class="component-label" x="844" y="217">
    K<tspan class="subscript" baseline-shift="sub">e</tspan>
    K<tspan class="subscript" baseline-shift="sub">t</tspan>/b
  </text>

  <circle class="junction" cx="650" cy="112" r="7"/>
  <circle class="junction" cx="650" cy="276" r="7"/>
  <circle class="junction" cx="800" cy="112" r="7"/>
  <circle class="junction" cx="800" cy="276" r="7"/>
</svg>
